<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل دخول المدير | أرماكس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              armax: {
                blue: "#003B6D",
                lightBlue: "#0056A3",
                orange: "#FF8C42",
                lightOrange: "#FFA726",
                dark: "#0F172A",
                darker: "#0B1120",
              },
            },
            fontFamily: {
              arabic: ["Tajawal", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Tajawal", sans-serif;
        background: linear-gradient(135deg, #003b6d 0%, #0f172a 100%);
      }
      .glass-effect {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .dark .glass-effect {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="inline-block p-4 rounded-full bg-white/10 mb-4">
          <i class="fas fa-user-shield text-5xl text-armax-orange"></i>
        </div>
        <h1 class="text-3xl font-black text-white mb-2">لوحة تحكم أرماكس</h1>
        <p class="text-blue-200">تسجيل دخول المدير</p>
      </div>

      <!-- Login Form -->
      <div class="glass-effect rounded-3xl shadow-2xl p-8 dark:bg-armax-dark">
        <form id="loginForm" class="space-y-6">
          <div>
            <label
              class="block text-gray-700 dark:text-gray-300 font-bold mb-2"
            >
              <i class="fas fa-user ml-2 text-armax-blue"></i>
              اسم المستخدم
            </label>
            <input
              type="text"
              id="username"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:border-armax-orange focus:ring-2 focus:ring-armax-orange/20 transition-all"
              placeholder="admin"
              required
            />
          </div>

          <div>
            <label
              class="block text-gray-700 dark:text-gray-300 font-bold mb-2"
            >
              <i class="fas fa-lock ml-2 text-armax-blue"></i>
              كلمة المرور
            </label>
            <div class="relative">
              <input
                type="password"
                id="password"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:border-armax-orange focus:ring-2 focus:ring-armax-orange/20 transition-all"
                placeholder="••••••"
                required
              />
              <button
                type="button"
                onclick="togglePassword()"
                class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
              >
                <i class="fas fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-sm">
            <label
              class="flex items-center text-gray-600 dark:text-gray-400 cursor-pointer"
            >
              <input
                type="checkbox"
                class="ml-2 rounded border-gray-300 text-armax-orange focus:ring-armax-orange"
              />
              تذكرني
            </label>
            <a
              href="#"
              class="text-armax-blue dark:text-armax-orange hover:underline"
              >نسيت كلمة المرور؟</a
            >
          </div>

          <button
            type="submit"
            class="w-full py-4 rounded-xl bg-armax-blue text-white font-bold text-lg hover:bg-armax-lightBlue transition-all transform hover:scale-[1.02] shadow-lg flex items-center justify-center gap-2"
          >
            <i class="fas fa-sign-in-alt"></i>
            دخول
          </button>
        </form>

        <div class="mt-6 text-center">
          <a
            href="index.html"
            class="text-gray-500 dark:text-gray-400 hover:text-armax-orange transition-colors flex items-center justify-center gap-2"
          >
            <i class="fas fa-arrow-right"></i>
            العودة للموقع
          </a>
        </div>
      </div>

      <!-- Security Note -->
      <div class="text-center mt-6 text-blue-200 text-sm">
        <i class="fas fa-shield-alt ml-1"></i>
        نظام آمن ومحمي
      </div>
    </div>

    <script>
      /*
      // تم تعليق كود التحقق من التوكن مؤقتاً
      const token = localStorage.getItem("adminToken");
      if (token) {
        console.log("تم العثور على توكن، جاري التوجيه...");
        window.location.replace("admin-dashboard.html");
      } else {
        console.log("لا يوجد توكن، عرض صفحة الدخول");
      }
      
      document.addEventListener("DOMContentLoaded", function () {
        const token = localStorage.getItem("adminToken");

        if (token) {
          setTimeout(() => {
            window.location.replace("admin-dashboard.html");
          }, 100);
        }
      });
      */

      function togglePassword() {
        const password = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");
        if (password.type === "password") {
          password.type = "text";
          eyeIcon.classList.remove("fa-eye");
          eyeIcon.classList.add("fa-eye-slash");
        } else {
          password.type = "password";
          eyeIcon.classList.remove("fa-eye-slash");
          eyeIcon.classList.add("fa-eye");
        }
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const submitBtn = this.querySelector('button[type="submit"]');

          // إظهار حالة التحميل
          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';

          /*
          // تم تعليق كود الاتصال بالـ API مؤقتاً
          try {
            const response = await fetch(
              "api/login.php",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password }),
              },
            );

            const data = await response.json();

            if (data.success && data.token) {
              localStorage.setItem("adminToken", data.token);
              localStorage.setItem("adminUser", JSON.stringify(data.user));
              localStorage.setItem("adminLoggedIn", "true");

              setTimeout(() => {
                window.location.replace("admin-dashboard.html");
              }, 500);
            } else {
              alert(data.message || "خطأ في اسم المستخدم أو كلمة المرور!");
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
            }
          } catch (error) {
            console.error("Error:", error);
            alert("خطأ في الاتصال بالخادم. تأكد من تشغيل السيرفر.");
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
          }
          */

          // التحقق المحلي المؤقت (بدون قاعدة بيانات)
          setTimeout(() => {
            if (username === "admin" && password === "123456") {
              // نجاح تسجيل الدخول
              const fakeToken = "admin_local_token_" + Date.now();

              localStorage.setItem("adminToken", fakeToken);
              localStorage.setItem(
                "adminUser",
                JSON.stringify({
                  name: "المسؤول",
                  role: "admin",
                  username: "admin",
                }),
              );
              localStorage.setItem("adminLoggedIn", "true");

              window.location.replace("admin-dashboard.html");
            } else {
              // فشل تسجيل الدخول
              alert(
                "خطأ في اسم المستخدم أو كلمة المرور!\n\nالبيانات الصحيحة:\nاسم المستخدم: admin\nكلمة المرور: 123456",
              );
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
            }
          }, 800); // تأخير بسيط لإظهار حالة التحميل
        });
    </script>
  </body>
</html>
